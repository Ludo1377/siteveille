<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteVeille — Statut en direct</title>
<style>
  :root {
    --bg: #1a1a28; --bg2: #2a1a4e; --card: #23233a; --amber: #f59e0b;
    --text: #e8e8f0; --muted: #9a9ab0; --ok: #4ade80; --down: #f87171; --warn: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text); min-height: 100vh; line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 1.8rem; margin-bottom: 6px; }
  h1 span { color: var(--amber); }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .site { background: var(--card); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; border: 1px solid #34344e; }
  .site .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .site .name { font-weight: 600; }
  .badge { padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
  .badge.up { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.down { background: rgba(248,113,113,.15); color: var(--down); }
  .badge.warn { background: rgba(251,191,36,.15); color: var(--warn); }
  .meta { color: var(--muted); font-size: 0.88rem; margin-top: 8px; }
  .meta b { color: var(--text); font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 40px; }
  footer a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Statut <span>en direct</span></h1>
  <p class="sub">Surveillance automatique toutes les 10 minutes — <span id="maj">chargement…</span></p>
  <div id="sites"><p style="color:var(--muted)">Chargement des sites…</p></div>
  <footer>SiteVeille par <a href="index.html">Dev du Sud</a> — Fos-sur-Mer, France</footer>
</div>
<script>
  const BADGE = { up: ["En ligne", "up"], down: ["En panne", "down"], "ssl-warn": ["SSL bientôt expiré", "warn"] };
  async function load() {
    try {
      const r = await fetch("status.json?t=" + Date.now());
      const d = await r.json();
      document.getElementById("maj").textContent = "dernière vérification : " + (d.generated_at || "").replace("T", " ").slice(0, 16);
      const el = document.getElementById("sites");
      el.innerHTML = "";
      for (const s of d.sites) {
        const [label, cls] = BADGE[s.status] || [s.status, "warn"];
        const div = document.createElement("div");
        div.className = "site";
        div.innerHTML = `
          <div class="top">
            <span class="name">${s.nom}</span>
            <span class="badge ${cls}">${label}</span>
          </div>
          <div class="meta">
            ${s.http ? `<b>HTTP ${s.http}</b> · ${s.response_ms} ms` : s.error || ""}
            ${s.ssl_days != null ? ` · SSL : <b>${s.ssl_days} jours</b>` : ""}
            ${s.uptime_24h != null ? ` · Dispo 24h : <b>${s.uptime_24h} %</b>` : ""}
          </div>`;
        el.appendChild(div);
      }
    } catch (e) {
      document.getElementById("sites").innerHTML = `<p style="color:var(--down)">Impossible de charger le statut.</p>`;
    }
  }
  load();
  setInterval(load, 120000);
</script>
</body>
</html>
